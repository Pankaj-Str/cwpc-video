
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRiLearn | Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #070914;
    color: white;
    overflow: hidden;
}

.launch-page {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, #17265b 0%, #0b1028 38%, #070914 75%);
}

/* Background glow */

.glow {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: #315bff;
    filter: blur(150px);
    opacity: .2;
    animation: glowMove 6s infinite alternate;
}

@keyframes glowMove {
    from { transform: scale(.8); }
    to { transform: scale(1.4); }
}

/* Main content */

.content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 25px;
    width: 100%;
    animation: reveal 1.5s ease;
}

@keyframes reveal {
    from { opacity: 0; transform: translateY(35px); }
    to { opacity: 1; transform: translateY(0); }
}

.top-label {
    color: #aabaff;
    letter-spacing: 7px;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 30px;
}

.brand-old {
    font-size: clamp(20px, 4vw, 38px);
    color: #9da5bd;
    font-weight: 400;
    animation: fade 3s infinite alternate;
}

.brand-old span {
    color: #ffffff;
    font-weight: 700;
}

.arrow {
    font-size: 30px;
    color: #7c9aff;
    margin: 15px 0;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    50% { transform: translateY(8px); }
}

.brand-new {
    font-size: clamp(65px, 13vw, 145px);
    font-weight: 900;
    letter-spacing: -7px;
    background: linear-gradient(
        110deg, #ffffff, #8daaff, #4776ff, #ffffff
    );
    background-size: 250%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
}

@keyframes shine {
    to { background-position: 250%; }
}

.tagline {
    color: #bdc9ed;
    font-size: 15px;
    letter-spacing: 4px;
    margin-top: 12px;
}

.divider {
    width: 100px;
    height: 3px;
    margin: 35px auto;
    background: linear-gradient(90deg, transparent, #5680ff, transparent);
}

/* Announcement */

.coming {
    display: inline-block;
    border: 1px solid #5477ff;
    padding: 12px 27px;
    border-radius: 50px;
    color: #b6c6ff;
    letter-spacing: 4px;
    font-size: 13px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { box-shadow: 0 0 25px #416dff88; }
}

.location {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    margin-top: 22px;
    letter-spacing: 2px;
}

.location span {
    color: #7295ff;
}

.description {
    margin-top: 15px;
    color: #9ca8c8;
    font-size: 14px;
    letter-spacing: 2px;
}

/* Loader */

.loader-area {
    margin-top: 55px;
}

.loader-ring {
    width: 48px;
    height: 48px;
    margin: auto;
    border: 3px solid #26345d;
    border-top: 3px solid #7093ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loader-text {
    color: #7583a9;
    font-size: 10px;
    letter-spacing: 5px;
    margin-top: 17px;
}

.footer {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #65708d;
    font-size: 11px;
    letter-spacing: 2px;
}

/* Particles */

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #7899ff;
    box-shadow: 0 0 12px #7295ff;
    animation: float 7s infinite ease-in-out;
}

.p1 { top: 20%; left: 15%; }
.p2 { top: 70%; left: 80%; animation-delay: 2s; }
.p3 { top: 35%; left: 85%; animation-delay: 1s; }
.p4 { top: 80%; left: 25%; animation-delay: 3s; }

@keyframes float {
    50% { transform: translateY(-35px); opacity: .3; }
}

@media(max-width:600px) {
    .brand-new { letter-spacing: -4px; }
    .top-label { letter-spacing: 4px; }
    .tagline { letter-spacing: 2px; }
    .footer { padding: 0 15px; }
}
</style>
</head>

<body>

<div class="launch-page">

    <div class="glow"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

    <main class="content">

        <div class="top-label">
            A New Era of Learning Begins
        </div>

        <div class="brand-old">
            Codes With <span>Pankaj</span>
        </div>

        <div class="arrow">↓</div>

        <h1 class="brand-new">PRiLearn</h1>

        <div class="tagline">
            LEARN • INNOVATE • SUCCEED
        </div>

        <div class="divider"></div>

        <div class="coming">
            SOMETHING BIG IS COMING
        </div>

        <div class="location">
            COMING TO <span>MUMBAI</span>
        </div>

        <div class="description">
            YOUR DESTINATION FOR IT & FINANCE EDUCATION
        </div>

        <div class="loader-area">
            <div class="loader-ring"></div>
            <div class="loader-text">
                LOADING THE FUTURE...
            </div>
        </div>

    </main>

    <footer class="footer">
        © 2026 PRiLearn | POWERED BY CODES WITH PANKAJ
    </footer>

</div>

</body>
</html>
